[project]
name = "amplifier-module-provider-openai-realtime"
version = "0.1.0"
description = "OpenAI Realtime API provider module for Amplifier - native speech-to-speech"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Microsoft MADE:Explorations Team" },
]
dependencies = [
    "amplifier-core>=2.0.1",
    "numpy>=2.3.4",
    "openai>=1.0.0",
    "websockets>=12.0",
]

[project.entry-points."amplifier.modules"]
provider-openai-realtime = "amplifier_module_provider_openai_realtime:mount"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_module_provider_openai_realtime"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]
